# Many less commonly used network protocols have recently had various
# security flaws discovered. In an effort to reduce the scope of future
# vulnerability exploitations, they are being blacklisted here so that
# unprivileged users cannot use them by default. System owners can still
# either modify this file, or specifically modprobe any needed protocols.

# ax25
alias net-pf-3 off
# netrom
alias net-pf-6 off
# x25
alias net-pf-9 off
# rose
alias net-pf-11 off
# decnet
alias net-pf-12 off
# econet
alias net-pf-19 off
# rds
alias net-pf-21 off
# af_802154
alias net-pf-36 off
# llc
alias net-pf-26 off
# phonet
alias net-pf-35 off
# kcm
alias net-pf-41 off
# qrtr
alias net-pf-42 off
# smc, which is also reachable through IPPROTO_SMC on AF_INET and AF_INET6,
# through its two generic netlink families and through its sock_diag module
alias net-pf-43 off
alias net-pf-2-proto-256-type-1 off
alias net-pf-10-proto-256-type-1 off
alias net-pf-16-proto-16-family-SMC_GEN_NETLINK off
alias net-pf-16-proto-16-family-SMC_PNETID off
alias net-pf-16-proto-4-type-43 off
